beCPG.project.formulation.enabled=true
beCPG.project.formulation.cronExpression=0 0 0/2 * * ?
beCPG.project.name.format={cm:name}


#Copy coma separated properties from parent to subproject
project.subProject.propsToCopyFromParent=
#Aggregate coma separated properties from subproject to parent
project.subProject.propsToCopyToParent=
project.extractor.myProjectAttributes=pjt:projectManager,cm:creator
#Automatically derive the project state from its task states (all cancelled -> Cancelled, one in progress -> InProgress, one on hold -> OnHold, only completed/cancelled -> Completed, else Planned)
project.formulation.autoProjectState=false

#Only serve the questions of the entity's own subsidiary (bcpg:subsidiaryRef on the question matched
#against bcpg:subsidiaryRef on the entity, same semantics as document types): a question without any
#subsidiary stays visible to everyone, stored answers are never modified. Disabled by default, the
#questionnaire is then served exactly as before.
beCPG.survey.subsidiaryScope.enabled=false

