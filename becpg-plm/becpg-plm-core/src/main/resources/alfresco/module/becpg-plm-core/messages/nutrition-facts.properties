# Wording of the regulatory nutrition facts panels.
# The regulation imposes the exact wording of these labels, they are NOT the characteristic names
# of the repository and must not be aligned on them.
#
#   nutritionFacts.panel.<regulation>.<key>     fixed wording of the panel
#   nutritionFacts.nutrient.<regulation>.<code> regulated name of a nutrient
#   nutritionFacts.footNote.<regulation>        daily value disclaimer
#   nutritionFacts.abbrev.<regulation>.<code>   shortened name used by the linear format

# --- United States, 21 CFR 101.9 -------------------------------------------------------------
nutritionFacts.panel.US.title                              = Nutrition Facts
nutritionFacts.panel.US.servingsPerContainer               = servings per container
nutritionFacts.panel.US.servingSize                        = Serving size
nutritionFacts.panel.US.servingsShort                      = Servings:
nutritionFacts.panel.US.servingSizeShort                   = Serv. size:
nutritionFacts.panel.US.amountPerServing                   = Amount per serving
nutritionFacts.panel.US.amountPerServingShort              = Amount/serving
nutritionFacts.panel.US.dailyValue                         = % Daily Value*
nutritionFacts.panel.US.dailyValueShort                    = %DV*
nutritionFacts.panel.US.perServing                         = Per serving
nutritionFacts.panel.US.perContainer                       = Per container
# What closes a parenthesised percentage in the linear format: "Sat. Fat 1g (5% DV)"
nutritionFacts.panel.US.dailyValueSuffix                   = DV
nutritionFacts.panel.US.linearLegend                       =
nutritionFacts.panel.US.footNoteEmphasis                   =

nutritionFacts.nutrient.US.US_ENER-E14                     = Calories
nutritionFacts.nutrient.US.FAT                             = Total Fat
nutritionFacts.nutrient.US.FASAT                           = Saturated Fat
nutritionFacts.nutrient.US.FATRN                           = Trans Fat
nutritionFacts.nutrient.US.FAMSCIS                         = Monounsaturated Fat
nutritionFacts.nutrient.US.FAPUCIS                         = Polyunsaturated Fat
nutritionFacts.nutrient.US.CHOL-                           = Cholesterol
nutritionFacts.nutrient.US.NA                              = Sodium
nutritionFacts.nutrient.US.CHO-                            = Total Carbohydrate
nutritionFacts.nutrient.US.FIBTG                           = Dietary Fiber
nutritionFacts.nutrient.US.FIBSOL                          = Soluble Fiber
nutritionFacts.nutrient.US.FIBINS                          = Insoluble Fiber
nutritionFacts.nutrient.US.SUGAR                           = Total Sugars
nutritionFacts.nutrient.US.SUGAD                           = Includes {0} Added Sugars
nutritionFacts.nutrient.US.POLYL                           = Sugar Alcohol
nutritionFacts.nutrient.US.PRO-                            = Protein
nutritionFacts.nutrient.US.VITD-                           = Vitamin D
nutritionFacts.nutrient.US.CA                              = Calcium
nutritionFacts.nutrient.US.FE                              = Iron
nutritionFacts.nutrient.US.K                               = Potassium
nutritionFacts.nutrient.US.VITA-                           = Vitamin A
nutritionFacts.nutrient.US.VITC-                           = Vitamin C

# Abbreviations of the linear format, 21 CFR 101.9(j)(13)(ii)(A)(2)
nutritionFacts.abbrev.US.FASAT                             = Sat. Fat
nutritionFacts.abbrev.US.FATRN                             = Trans Fat
nutritionFacts.abbrev.US.CHOL-                             = Cholest.
nutritionFacts.abbrev.US.CHO-                              = Total Carb.
nutritionFacts.abbrev.US.FIBTG                             = Fiber
nutritionFacts.abbrev.US.SUGAD                             = Incl. {0} Added Sugars
nutritionFacts.abbrev.US.VITD-                             = Vit. D
nutritionFacts.abbrev.US.K                                 = Potas.

# Statement closing a simplified panel, 21 CFR 101.9(f)(4)
nutritionFacts.notSignificantSource.US                     = Not a significant source of other nutrients.

nutritionFacts.footNote.US                                 = * The % Daily Value (DV) tells you how much a nutrient in a serving of food contributes to a daily diet. 2,000 calories a day is used for general nutrition advice.

# --- Canada, B.01.401 ------------------------------------------------------------------------
# The Canadian panel opens on a "Per <serving>" line instead of the two lines of the FDA one,
# so servingSize carries the preposition and servingsPerContainer stays unused.
nutritionFacts.panel.CA.title                              = Nutrition Facts
nutritionFacts.panel.CA.servingsPerContainer               =
nutritionFacts.panel.CA.servingSize                        = Per
nutritionFacts.panel.CA.amountPerServing                   =
nutritionFacts.panel.CA.amountPerServingShort              = Amount/serving
nutritionFacts.panel.CA.dailyValue                         = % Daily Value*
nutritionFacts.panel.CA.dailyValueShort                    = %DV*
nutritionFacts.panel.CA.perServing                         = Per serving
nutritionFacts.panel.CA.perContainer                       = Per container
# The Canadian linear format parenthesises the bare percentage and explains it in a legend, and
# its footnote sets the two verdicts of the little/lot rule in the heavy face.
nutritionFacts.panel.CA.dailyValueSuffix                   =
nutritionFacts.panel.CA.linearLegend                       = % = % Daily Value
nutritionFacts.panel.CA.footNoteEmphasis                   = a little,a lot
# Supplemented foods, SOR/2022-143: the table is titled differently and closes on the block of the
# ingredients the product was supplemented with.
nutritionFacts.panel.CA.supplementedTitle                  = Supplemented Food Facts
nutritionFacts.panel.CA.supplementedWith                   = Supplemented with
nutritionFacts.panel.CA.supplementedNote                   = Includes naturally occurring and supplemental amounts

nutritionFacts.nutrient.CA.US_ENER-E14                     = Calories
nutritionFacts.nutrient.CA.FAT                             = Fat
nutritionFacts.nutrient.CA.FASAT                           = Saturated
nutritionFacts.nutrient.CA.FATRN                           = + Trans
nutritionFacts.nutrient.CA.CHO-                            = Carbohydrate
nutritionFacts.nutrient.CA.FIBTG                           = Fibre
nutritionFacts.nutrient.CA.SUGAR                           = Sugars
nutritionFacts.nutrient.CA.PRO-                            = Protein
nutritionFacts.nutrient.CA.CHOL-                           = Cholesterol
nutritionFacts.nutrient.CA.NA                              = Sodium
nutritionFacts.nutrient.CA.K                               = Potassium
nutritionFacts.nutrient.CA.CA                              = Calcium
nutritionFacts.nutrient.CA.FE                              = Iron
nutritionFacts.nutrient.CA.VITD-                           = Vitamin D
nutritionFacts.nutrient.CA.VITA-                           = Vitamin A

nutritionFacts.footNote.CA                                 = * 5% or less is a little, 15% or more is a lot
