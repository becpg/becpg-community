# Wording of the score markings rendered as SVG on the server (score-*.ftlx templates).
#
#   score.marking.part.<code>       wording of a part, a nutrient code for the front of pack marks
#   score.marking.verdict.<level>   wording of a verdict, level being low, medium or high
#   score.marking.referenceIntake   share of the reference intake, {0} being the formatted share
#   score.marking.caption.<code>    line a marking states under its name, none when missing
#   score.marking.fop.*             the UK front of pack marking a technical sheet prints
#
# The front of pack traffic lights are a UK scheme, their base wording is the FSA one.
score.marking.part.ENER-KJO    = Energy
score.marking.part.ENER-KJ     = Energy
score.marking.part.ENER-KCAL   = Energy
score.marking.part.ENER-E14    = Energy
score.marking.part.ENERGY      = Energy
score.marking.part.FAT         = Fat
score.marking.part.FASAT       = Saturates
score.marking.part.SUGAR       = Sugars
score.marking.part.NACL        = Salt
score.marking.part.NA          = Sodium
score.marking.part.FATRN       = Trans fat
score.marking.part.PRO-        = Protein
score.marking.part.FIBTG       = Fibre

score.marking.verdict.low      = LOW
score.marking.verdict.medium   = MED
score.marking.verdict.high     = HIGH

score.marking.referenceIntake  = {0}% RI

score.marking.fop.caption              = Each serving ({0}) contains
score.marking.fop.referenceIntakeNote  = % of an adult''s reference intake
score.marking.fop.typicalValues        = Typical values per {0}: Energy {1}

score.marking.caption.ECOBEAUTYSCORE    = Environmental impact
score.marking.caption.GREENIMPACTINDEX  = Environmental impact of the product
