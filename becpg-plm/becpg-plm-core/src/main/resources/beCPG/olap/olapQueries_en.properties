# Display labels of the OLAP queries, dashboards and applications shipped by beCPG.
#
# The files themselves are named by technical id and carry no label: the id is the identity
# referenced by dashboards, by the Share dashlet preference and by the Saiku repository, while
# the label below only decides what the user reads. Adding a language means adding a bundle
# here - no file to rename, no reference to rewrite.
#
# At init-repo the label of the repository locale becomes cm:name, and every language found
# here becomes one value of the cm:title MLText.

